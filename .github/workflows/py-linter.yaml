name: Lint Python Code

on:
  pull_request:
    branches:
      - development  

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code for the current branch
        uses: actions/checkout@v4

      - name: Set up Python base env 
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'  

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8  

      - name: Get changed files
        id: files
        run: |
          echo "Finding changed files..."
          git fetch origin development &> /dev/null
          CHANGED_FILES=$(git diff --name-only origin/development | grep -E '\.py$')
          echo $CHANGED_FILES > changed_files.txt
          echo "Changed Python files:"
          cat changed_files.txt

      - name: Lint changed files
        run: |
          CHANGED_FILES=$(cat changed_files.txt)
          if [ -n "$CHANGED_FILES" ]; then
            echo Running Flake8 linter...
            flake8 --max-line-length=79 --statistics $CHANGED_FILES
          else
            echo No Python files changed.
            exit 0
          fi
