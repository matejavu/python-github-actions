name: Lint Python Code

on:
  pull_request:
    branches:
      - development  # Adjust this to your default branch if necessary

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'  # Specify the Python version you want to use

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8  # You can add other dependencies here as well

      - name: Get changed files
        id: files
        run: |
          echo "Changed files:"
          changed_files=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E '\.py$')
          echo "$changed_files" > changed_files.txt
          cat changed_files.txt

      - name: Lint changed files
        run: |
          changed_files=$(cat changed_files.txt)
          if [ -n "$changed_files" ]; then
            flake8 $changed_files
          else
            echo "No Python files changed."
          fi