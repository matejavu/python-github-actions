name: Lint Python Code

on:
  pull_request:
    branches:
      - development  # Adjust this to your default branch if necessary

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'  # Specify the Python version you want to use

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8  # You can add other dependencies here as well

      - name: Lint with flake8
        run: |
          flake8 .  # Lint the code in the repository